
<!-- Include SBIXIFY boost audio client (ytdl proxy integration)
     This snippet adds the client/boost-audio.js script and initializes it
     with a window-local proxy origin (http://localhost:3000) and no default
     video ID. The user can change the proxy origin in settings or call
     BoostAudio.connectVideoId(videoId) from the console.
-->
<script>
  (function(){
    // Only inject if not already present
    if (document.getElementById('sbixify-boost-script-inject')) return;
    var s = document.createElement('script');
    s.id = 'sbixify-boost-script-inject';
    s.src = '/client/boost-audio.js';
    s.defer = true;
    s.onload = function(){
      // Init with localhost proxy by default; change as needed
      try{ if (window.BoostAudioInit) window.BoostAudioInit({ proxyOrigin: 'http://localhost:3000' }); } catch(e){}
    };
    document.head.appendChild(s);
  })();
</script>
